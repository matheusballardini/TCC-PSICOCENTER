<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Psicólogo - Psicocenter</title>
    <meta name="description" content="Cadastre-se gratuitamente como psicólogo no Psicocenter e amplie seu alcance com pacientes que buscam atendimento.">
    <link rel="stylesheet" href="../style/loginpaciente.css">
    <link rel="stylesheet" href="../style/register.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <script src="../js/api-config.js"></script>
    <script defer src="../js/image-compress.js"></script>
    <script defer src="../js/cidades.js"></script>
    <script defer src="../js/register.js"></script>
</head>
<body>
    <header class="cabecalho-cadastro">
        <img src="../images/logo-psico-center.png" alt="Logo Psicocenter">
        <h1 class="titulo-cadastro">Psicocenter</h1>
        <a href="entrar.html" class="voltar-cadastro">← Voltar</a>
    </header>

    <div class="wrapper">
        <form id="cadastroPsicologoForm" onsubmit="register(event, 'psicologo')">
            <h1>Cadastro Psicólogo</h1>

            <p class="section-title" data-step="1">Dados pessoais</p>
            <div class="foto-upload">
                <div class="photo-preview-wrap">
                    <img id="photoPreview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' rx='100' fill='%23c7d2e3'/><circle cx='100' cy='78' r='38' fill='%23ffffff'/><path d='M34 172c8-46 42-70 66-70s58 24 66 70' fill='%23ffffff'/></svg>" alt="Pré-visualização da foto">
                </div>
                <label class="file-label" for="photo">Escolher foto</label>
                <input id="photo" type="file" accept="image/*">
            </div>
            <div class="input-box">
                <label for="full_name" class="field-label">Nome completo</label>
                <input id="full_name" type="text" placeholder="Nome completo" minlength="5" maxlength="100" required>
                <i class="bx bx-user"></i>
            </div>
            <div class="input-box">
                <label for="cpf" class="field-label">CPF</label>
                <input id="cpf" type="text" inputmode="numeric" placeholder="CPF" maxlength="14" required>
            </div>
            <div class="input-box">
                <label for="birth_date" class="field-label">Data de nascimento</label>
                <input id="birth_date" type="date" min="1900-01-01" required>
            </div>
            <div class="input-box">
                <label for="phone" class="field-label">Telefone</label>
                <input id="phone" type="tel" inputmode="numeric" placeholder="Telefone" maxlength="16" required>
            </div>
            <div class="input-box full-width">
                <label for="email" class="field-label">E-mail</label>
                <input id="email" type="email" placeholder="E-mail" required>
            </div>

            <p class="section-title" data-step="2">Dados profissionais</p>
            <div class="input-box">
                <label for="crp" class="field-label">CRP</label>
                <input id="crp" type="text" inputmode="numeric" placeholder="CRP (ex: 06/123456)" minlength="7" maxlength="9" required>
            </div>
            <div class="input-box">
                <label for="crp_state" class="field-label">Estado do CRP</label>
                <select id="crp_state" required>
                    <option value="">Estado do CRP</option>
                    <option value="AC">Acre (AC)</option>
                    <option value="AL">Alagoas (AL)</option>
                    <option value="AP">Amapá (AP)</option>
                    <option value="AM">Amazonas (AM)</option>
                    <option value="BA">Bahia (BA)</option>
                    <option value="CE">Ceará (CE)</option>
                    <option value="DF">Distrito Federal (DF)</option>
                    <option value="ES">Espírito Santo (ES)</option>
                    <option value="GO">Goiás (GO)</option>
                    <option value="MA">Maranhão (MA)</option>
                    <option value="MT">Mato Grosso (MT)</option>
                    <option value="MS">Mato Grosso do Sul (MS)</option>
                    <option value="MG">Minas Gerais (MG)</option>
                    <option value="PA">Pará (PA)</option>
                    <option value="PB">Paraíba (PB)</option>
                    <option value="PR">Paraná (PR)</option>
                    <option value="PE">Pernambuco (PE)</option>
                    <option value="PI">Piauí (PI)</option>
                    <option value="RJ">Rio de Janeiro (RJ)</option>
                    <option value="RN">Rio Grande do Norte (RN)</option>
                    <option value="RS">Rio Grande do Sul (RS)</option>
                    <option value="RO">Rondônia (RO)</option>
                    <option value="RR">Roraima (RR)</option>
                    <option value="SC">Santa Catarina (SC)</option>
                    <option value="SP">São Paulo (SP)</option>
                    <option value="SE">Sergipe (SE)</option>
                    <option value="TO">Tocantins (TO)</option>
                </select>
            </div>
            <div class="input-box">
                <label for="education" class="field-label">Formação</label>
                <select id="education" required>
                    <option value="">Formação</option>
                    <option value="Psicologia Clínica">Psicologia Clínica</option>
                    <option value="Psicologia Organizacional e do Trabalho">Psicologia Organizacional e do Trabalho</option>
                    <option value="Psicologia Escolar e Educacional">Psicologia Escolar e Educacional</option>
                    <option value="Psicologia Jurídica">Psicologia Jurídica</option>
                    <option value="Neuropsicologia">Neuropsicologia</option>
                    <option value="Psicologia Social">Psicologia Social</option>
                    <option value="Psicologia Hospitalar">Psicologia Hospitalar</option>
                    <option value="Psicologia do Esporte">Psicologia do Esporte</option>
                    <option value="Psicologia do Trânsito">Psicologia do Trânsito</option>
                    <option value="Psicopedagogia">Psicopedagogia</option>
                    <option value="Psicologia em Saúde">Psicologia em Saúde</option>
                    <option value="Psicologia de Cuidado Paliativo">Psicologia de Cuidado Paliativo</option>
                </select>
            </div>
            <div class="input-box">
                <label for="years_experience" class="field-label">Anos de experiência</label>
                <input id="years_experience" type="number" min="0" max="80" placeholder="Anos de experiência" >
            </div>
            <div class="input-box full-width">
                <label for="institution" class="field-label">Instituição onde se formou</label>
                <select id="institution" required>
                    <option value="">Instituição onde se formou</option>
                    <option value="Universidade de São Paulo (USP)">Universidade de São Paulo (USP)</option>
                    <option value="Universidade Estadual de Campinas (UNICAMP)">Universidade Estadual de Campinas (UNICAMP)</option>
                    <option value="Universidade Estadual Paulista (UNESP)">Universidade Estadual Paulista (UNESP)</option>
                    <option value="Universidade Federal do Rio de Janeiro (UFRJ)">Universidade Federal do Rio de Janeiro (UFRJ)</option>
                    <option value="Universidade Federal de Minas Gerais (UFMG)">Universidade Federal de Minas Gerais (UFMG)</option>
                    <option value="Universidade Federal da Bahia (UFBA)">Universidade Federal da Bahia (UFBA)</option>
                    <option value="Universidade Federal de Pernambuco (UFPE)">Universidade Federal de Pernambuco (UFPE)</option>
                    <option value="Universidade Federal do Rio Grande do Sul (UFRGS)">Universidade Federal do Rio Grande do Sul (UFRGS)</option>
                    <option value="Universidade Federal de Santa Catarina (UFSC)">Universidade Federal de Santa Catarina (UFSC)</option>
                    <option value="Universidade de Brasília (UnB)">Universidade de Brasília (UnB)</option>
                    <option value="Universidade Federal do Ceará (UFC)">Universidade Federal do Ceará (UFC)</option>
                    <option value="Universidade Federal do Pará (UFPA)">Universidade Federal do Pará (UFPA)</option>
                    <option value="Universidade Federal do Amazonas (UFAM)">Universidade Federal do Amazonas (UFAM)</option>
                    <option value="Universidade Federal do Espírito Santo (UFES)">Universidade Federal do Espírito Santo (UFES)</option>
                    <option value="Universidade Federal do Paraná (UFPR)">Universidade Federal do Paraná (UFPR)</option>
                    <option value="Universidade Federal Fluminense (UFF)">Universidade Federal Fluminense (UFF)</option>
                    <option value="Universidade do Estado do Rio de Janeiro (UERJ)">Universidade do Estado do Rio de Janeiro (UERJ)</option>
                    <option value="Universidade Estadual de Londrina (UEL)">Universidade Estadual de Londrina (UEL)</option>
                    <option value="Universidade Estadual de Maringá (UEM)">Universidade Estadual de Maringá (UEM)</option>
                    <option value="Pontifícia Universidade Católica de São Paulo (PUC-SP)">Pontifícia Universidade Católica de São Paulo (PUC-SP)</option>
                    <option value="Pontifícia Universidade Católica do Rio de Janeiro (PUC-Rio)">Pontifícia Universidade Católica do Rio de Janeiro (PUC-Rio)</option>
                    <option value="Pontifícia Universidade Católica do Rio Grande do Sul (PUCRS)">Pontifícia Universidade Católica do Rio Grande do Sul (PUCRS)</option>
                    <option value="Pontifícia Universidade Católica de Minas Gerais (PUC Minas)">Pontifícia Universidade Católica de Minas Gerais (PUC Minas)</option>
                    <option value="Pontifícia Universidade Católica de Campinas (PUC-Campinas)">Pontifícia Universidade Católica de Campinas (PUC-Campinas)</option>
                    <option value="Pontifícia Universidade Católica do Paraná (PUCPR)">Pontifícia Universidade Católica do Paraná (PUCPR)</option>
                    <option value="Universidade Presbiteriana Mackenzie">Universidade Presbiteriana Mackenzie</option>
                    <option value="Universidade Nove de Julho (UNINOVE)">Universidade Nove de Julho (UNINOVE)</option>
                    <option value="Universidade Paulista (UNIP)">Universidade Paulista (UNIP)</option>
                    <option value="Universidade Anhembi Morumbi">Universidade Anhembi Morumbi</option>
                    <option value="Universidade Estácio de Sá">Universidade Estácio de Sá</option>
                    <option value="Universidade Norte do Paraná (UNOPAR)">Universidade Norte do Paraná (UNOPAR)</option>
                    <option value="Centro Universitário Internacional (UNINTER)">Centro Universitário Internacional (UNINTER)</option>
                    <option value="Universidade Cidade de São Paulo (UNICID)">Universidade Cidade de São Paulo (UNICID)</option>
                    <option value="Universidade Metodista de São Paulo (UMESP)">Universidade Metodista de São Paulo (UMESP)</option>
                    <option value="Universidade de Mogi das Cruzes (UMC)">Universidade de Mogi das Cruzes (UMC)</option>
                    <option value="Universidade São Judas Tadeu">Universidade São Judas Tadeu</option>
                    <option value="Universidade Cruzeiro do Sul">Universidade Cruzeiro do Sul</option>
                    <option value="Universidade Federal de Mato Grosso do Sul (UFMS)">Universidade Federal de Mato Grosso do Sul (UFMS)</option>
                    <option value="Universidade Federal de Mato Grosso (UFMT)">Universidade Federal de Mato Grosso (UFMT)</option>
                    <option value="Universidade Federal de Goiás (UFG)">Universidade Federal de Goiás (UFG)</option>
                    <option value="Universidade Federal da Paraíba (UFPB)">Universidade Federal da Paraíba (UFPB)</option>
                    <option value="Universidade Federal do Rio Grande do Norte (UFRN)">Universidade Federal do Rio Grande do Norte (UFRN)</option>
                    <option value="Universidade Federal do Piauí (UFPI)">Universidade Federal do Piauí (UFPI)</option>
                    <option value="Universidade Federal do Maranhão (UFMA)">Universidade Federal do Maranhão (UFMA)</option>
                    <option value="Universidade Federal de Alagoas (UFAL)">Universidade Federal de Alagoas (UFAL)</option>
                    <option value="Universidade Federal de Sergipe (UFS)">Universidade Federal de Sergipe (UFS)</option>
                    <option value="Universidade Federal de Roraima (UFRR)">Universidade Federal de Roraima (UFRR)</option>
                    <option value="Universidade Federal do Amapá (UNIFAP)">Universidade Federal do Amapá (UNIFAP)</option>
                    <option value="Universidade Federal de Rondônia (UNIR)">Universidade Federal de Rondônia (UNIR)</option>
                    <option value="Universidade Federal do Acre (UFAC)">Universidade Federal do Acre (UFAC)</option>
                    <option value="Universidade Federal do Tocantins (UFT)">Universidade Federal do Tocantins (UFT)</option>
                    <option value="Universidade Federal de Ouro Preto (UFOP)">Universidade Federal de Ouro Preto (UFOP)</option>
                    <option value="Universidade Federal de Lavras (UFLA)">Universidade Federal de Lavras (UFLA)</option>
                    <option value="Universidade Federal de Juiz de Fora (UFJF)">Universidade Federal de Juiz de Fora (UFJF)</option>
                    <option value="Universidade Federal de São João del-Rei (UFSJ)">Universidade Federal de São João del-Rei (UFSJ)</option>
                    <option value="Universidade Federal de Viçosa (UFV)">Universidade Federal de Viçosa (UFV)</option>
                    <option value="Universidade Federal de Uberlândia (UFU)">Universidade Federal de Uberlândia (UFU)</option>
                    <option value="Universidade Federal de São Carlos (UFSCar)">Universidade Federal de São Carlos (UFSCar)</option>
                    <option value="Universidade Federal do ABC (UFABC)">Universidade Federal do ABC (UFABC)</option>
                    <option value="Universidade Federal de São Paulo (UNIFESP)">Universidade Federal de São Paulo (UNIFESP)</option>
                    <option value="Universidade Federal do Estado do Rio de Janeiro (UNIRIO)">Universidade Federal do Estado do Rio de Janeiro (UNIRIO)</option>
                    <option value="Universidade Estadual do Norte Fluminense (UENF)">Universidade Estadual do Norte Fluminense (UENF)</option>
                    <option value="Universidade Estadual de Goiás (UEG)">Universidade Estadual de Goiás (UEG)</option>
                    <option value="Universidade Estadual do Ceará (UECE)">Universidade Estadual do Ceará (UECE)</option>
                    <option value="Universidade do Vale do Acaraú (UVA)">Universidade do Vale do Acaraú (UVA)</option>
                    <option value="Universidade do Estado da Bahia (UNEB)">Universidade do Estado da Bahia (UNEB)</option>
                    <option value="Universidade Estadual do Sudoeste da Bahia (UESB)">Universidade Estadual do Sudoeste da Bahia (UESB)</option>
                    <option value="Universidade Estadual de Santa Cruz (UESC)">Universidade Estadual de Santa Cruz (UESC)</option>
                    <option value="Universidade Estadual de Montes Claros (UNIMONTES)">Universidade Estadual de Montes Claros (UNIMONTES)</option>
                    <option value="Centro Universitário de Jaguariúna (UNIFAJ)">Centro Universitário de Jaguariúna (UNIFAJ)</option>
                    <option value="Outra">Outra instituição (não listada)</option>
                </select>
            </div>
            <div class="input-box">
                <div class="textarea-wrap">
                    <textarea id="bio" rows="4" maxlength="500" placeholder="Breve descrição/sobre o profissional (máx. 500 caracteres)" required></textarea>
                    <span id="bioCounter" class="char-counter">0/500</span>
                </div>
            </div>

            <p class="section-title" data-step="3">Especialidades (marque uma ou mais)</p>
            <div class="checkbox-grid">
                <label><input type="checkbox" name="specialty" value="Ansiedade"> Ansiedade</label>
                <label><input type="checkbox" name="specialty" value="Depressão"> Depressão</label>
                <label><input type="checkbox" name="specialty" value="Relacionamentos"> Relacionamentos</label>
                <label><input type="checkbox" name="specialty" value="Autoestima"> Autoestima</label>
                <label><input type="checkbox" name="specialty" value="Luto"> Luto</label>
                <label><input type="checkbox" name="specialty" value="Terapia de Casal"> Terapia de Casal</label>
                <label><input type="checkbox" name="specialty" value="Terapia Infantil"> Terapia Infantil</label>
                <label><input type="checkbox" name="specialty" value="Burnout"> Burnout</label>
                <label><input type="checkbox" name="specialty" value="Trauma"> Trauma</label>
                <label><input type="checkbox" name="specialty" value="Família"> Família</label>
                <label><input type="checkbox" name="specialty" value="Desenvolvimento"> Desenvolvimento</label>
                <label><input type="checkbox" name="specialty" value="Outros"> Outros</label>
            </div>

            <p class="section-title" data-step="4">Modalidade de atendimento</p>
            <div class="modalidade-row">
                <label><input type="checkbox" id="mod_online"> Online</label>
                <label><input type="checkbox" id="mod_presencial"> Presencial</label>
            </div>

            <div id="presencialFields" class="full-width" style="display:none;margin-top:8px">
                <div class="input-box">
                    <label for="cep" class="field-label">CEP do consultório</label>
                    <input id="cep" type="text" inputmode="numeric" placeholder="CEP do consultório (opcional)" maxlength="9">
                </div>
                <div class="input-box">
                    <label for="address_number" class="field-label">Número</label>
                    <input id="address_number" type="text" placeholder="Número (opcional)" maxlength="20">
                </div>
                <div class="input-box">
                    <label for="state" class="field-label">Estado</label>
                    <select id="state">
                        <option value="">Estado</option>
                        <option value="AC">Acre (AC)</option>
                        <option value="AL">Alagoas (AL)</option>
                        <option value="AP">Amapá (AP)</option>
                        <option value="AM">Amazonas (AM)</option>
                        <option value="BA">Bahia (BA)</option>
                        <option value="CE">Ceará (CE)</option>
                        <option value="DF">Distrito Federal (DF)</option>
                        <option value="ES">Espírito Santo (ES)</option>
                        <option value="GO">Goiás (GO)</option>
                        <option value="MA">Maranhão (MA)</option>
                        <option value="MT">Mato Grosso (MT)</option>
                        <option value="MS">Mato Grosso do Sul (MS)</option>
                        <option value="MG">Minas Gerais (MG)</option>
                        <option value="PA">Pará (PA)</option>
                        <option value="PB">Paraíba (PB)</option>
                        <option value="PR">Paraná (PR)</option>
                        <option value="PE">Pernambuco (PE)</option>
                        <option value="PI">Piauí (PI)</option>
                        <option value="RJ">Rio de Janeiro (RJ)</option>
                        <option value="RN">Rio Grande do Norte (RN)</option>
                        <option value="RS">Rio Grande do Sul (RS)</option>
                        <option value="RO">Rondônia (RO)</option>
                        <option value="RR">Roraima (RR)</option>
                        <option value="SC">Santa Catarina (SC)</option>
                        <option value="SP">São Paulo (SP)</option>
                        <option value="SE">Sergipe (SE)</option>
                        <option value="TO">Tocantins (TO)</option>
                    </select>
                </div>
                <div class="input-box">
                    <label for="city" class="field-label">Cidade</label>
                    <select id="city" disabled>
                        <option value="">Selecione um estado primeiro</option>
                    </select>
                </div>
                <div class="input-box full-width">
                    <label for="address" class="field-label">Endereço do consultório</label>
                    <input id="address" type="text" placeholder="Endereço do consultório" maxlength="150">
                </div>
            </div>

            <p class="section-title" data-step="5">Valores por sessão (R$)</p>
            <div class="price-row">
                <div class="price-field">
                    <label for="price_min">Valor mínimo</label>
                    <input id="price_min" type="number" min="1" placeholder="Ex: 100" class="small-input no-spinner" required>
                </div>
                <div class="price-field">
                    <label for="price_max">Valor máximo</label>
                    <input id="price_max" type="number" min="1" placeholder="Ex: 200" class="small-input no-spinner" required>
                </div>
            </div>

            <p class="section-title" data-step="6">Disponibilidade</p>
            <div class="full-width">
                <div class="day-row">
                    <label><input type="checkbox" id="day_mon"> Segunda</label>
                    <input id="mon_start" type="time" min="06:00" max="22:00"> - <input id="mon_end" type="time" min="06:00" max="22:00">
                </div>
                <div class="day-row">
                    <label><input type="checkbox" id="day_tue"> Terça</label>
                    <input id="tue_start" type="time" min="06:00" max="22:00"> - <input id="tue_end" type="time" min="06:00" max="22:00">
                </div>
                <div class="day-row">
                    <label><input type="checkbox" id="day_wed"> Quarta</label>
                    <input id="wed_start" type="time" min="06:00" max="22:00"> - <input id="wed_end" type="time" min="06:00" max="22:00">
                </div>
                <div class="day-row">
                    <label><input type="checkbox" id="day_thu"> Quinta</label>
                    <input id="thu_start" type="time" min="06:00" max="22:00"> - <input id="thu_end" type="time" min="06:00" max="22:00">
                </div>
                <div class="day-row">
                    <label><input type="checkbox" id="day_fri"> Sexta</label>
                    <input id="fri_start" type="time" min="06:00" max="22:00"> - <input id="fri_end" type="time" min="06:00" max="22:00">
                </div>
                <div class="day-row">
                    <label><input type="checkbox" id="day_sat"> Sábado</label>
                    <input id="sat_start" type="time" min="06:00" max="22:00"> - <input id="sat_end" type="time" min="06:00" max="22:00">
                </div>
                <div class="day-row">
                    <label><input type="checkbox" id="day_sun"> Domingo</label>
                    <input id="sun_start" type="time" min="06:00" max="22:00"> - <input id="sun_end" type="time" min="06:00" max="22:00">
                </div>
            </div>

            <div class="input-box full-width" style="margin-top:12px">
                <label for="password" class="field-label">Senha</label>
                <input id="password" type="password" placeholder="Senha" required>
                <i class="bx bx-lock" id="togglePassword"></i>
            </div>

            <button type="submit" class="btn">Cadastrar</button>
            <p id="registerMessage" class="register-link"></p>
            <div class="register-link">
                <p>Já tem conta? <a href="loginpsicologo.html" class="entrar">Entrar</a></p>
            </div>
        </form>
    </div>

    <script>
        // Limpa o formulário quando a página carrega para criar um NOVO psicólogo
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('cadastroPsicologoForm');
            if (form) {
                form.reset();
                // Desmarcar todas as especialidades
                document.querySelectorAll('input[name="specialty"]').forEach(el => el.checked = false);
                // Desmarcar modalidades
                document.getElementById('mod_online').checked = false;
                document.getElementById('mod_presencial').checked = false;
                // Desmarcar dias
                ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'].forEach(day => {
                    const checkbox = document.getElementById(`day_${day}`);
                    if (checkbox) checkbox.checked = false;
                });
                // Limpar campos de horário
                ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'].forEach(day => {
                    const startInput = document.getElementById(`${day}_start`);
                    const endInput = document.getElementById(`${day}_end`);
                    if (startInput) startInput.value = '';
                    if (endInput) endInput.value = '';
                });
            }
        });

        const presCheckbox = document.getElementById('mod_presencial');
        const presFields = document.getElementById('presencialFields');
        presCheckbox.addEventListener('change', () => {
            presFields.style.display = presCheckbox.checked ? 'grid' : 'none';
        });

        // pré-visualização da foto escolhida no cadastro
        const photoInput = document.getElementById('photo');
        const photoPreview = document.getElementById('photoPreview');
        photoInput.addEventListener('change', () => {
            const file = photoInput.files && photoInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => { photoPreview.src = reader.result; };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
