<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicocenter</title>

    <link rel="stylesheet" href="../style/loginpsicologo.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <script src="../js/login.js"></script>

</head>

<body>

   

    <div class="wrapper">

        <form action="">

            <h1>login</h1>

            <div class="input-box">
                
                <input id="email" type="text" placeholder="Email" required>
                <i class="bx bx-user"></i>

            </div>

            <div class="input-box">
                
                <input id="senha_usuario" type="password" placeholder="Senha" required>
                <i class="bx bx-lock"></i>

            </div>

            <button type="submit" class="btn" onclick="login(); return false;">
                Login
            </button>

            <div class="register-link">
                <p>
                    Não tem conta?
                    <a href="cadastro_psicologo.html">
                        Cadastre-se
                    </a>
                </p>
            </div>

        </form>

    </div>

</body>
</html>
