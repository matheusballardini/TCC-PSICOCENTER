<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Psicocenter</title>
    <link rel="stylesheet" href="../style/perfil.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
</head>

<body>


    <!-- MENU LATERAL -->

    <aside class="sidebar">

        <div class="logo">
            <img src="../images/logo-psico-center.png" alt="Logo Psicocenter">
            <span>Psicocenter</span>
        </div>


        <div class="usuario">

            <div class="avatar-ring">
                <img id="sidebarPhoto" src="../images/psicologo.webp" alt="Foto">
            </div>

            <h3 id="sidebarName">Dr. João Silva</h3>

            <span id="sidebarRole" class="cargo-badge">Psicólogo</span>

        </div>


        <nav>

            <a href="perfil.html" class="active">
                <i class='bx bx-user'></i>
                <span>Perfil</span>
            </a>


            <a href="pacientes.html">
                <i class='bx bx-group'></i>
                <span>Pacientes</span>
            </a>


            <a href="agendamentos.html">
                <i class='bx bx-calendar'></i>
                <span>Agendamentos</span>
            </a>


        </nav>




    </aside>




    <!-- CONTEÚDO -->

    <main class="conteudo">

        <a href="editar_perfil.html" id="editBtn" class="btn-edit-top">Editar Perfil</a>

        <section class="perfil">


            <h1>Meu Perfil</h1>
            <p id="loadingIndicator" style="display:none; opacity:0.7; margin-top:-8px;">Carregando dados...</p>


            <div class="card">



                <img id="profilePhoto" class="foto-perfil" src="../images/psicologo.webp" alt="Foto do Psicólogo">


                <h2 id="fullName">
                    Dr. João Silva
                </h2>


                <p id="role">
                    Psicólogo Clínico
                </p>


                <hr>


                <div class="informacoes">

                    <p>
                        <strong>Email:</strong>
                        <span id="emailVal">joao@email.com</span>
                    </p>


                    <p>
                        <strong>Telefone:</strong>
                        <span id="phoneVal">(11) 99999-9999</span>
                    </p>


                    <p>
                        <strong>CRP:</strong>
                        <span id="crpVal">06/123456</span>
                    </p>

                    <p>
                        <strong>Biografia:</strong>
                        <span id="bioVal"></span>
                    </p>


                </div>


                <button id="scheduleBtn" class="editar" style="display:none; margin-top: 12px;">
                    Agendar consulta
                </button>


            </div>


        </section>


    </main>



</body>

    <script src="../js/perfil.js"></script>

</html>
