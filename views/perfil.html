<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Psicocenter</title>
    <link rel="stylesheet" href="../style/perfil.css">
    <link rel="stylesheet" href="../style/chat-badge.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
</head>

<body>


    <!-- MENU LATERAL -->

    <aside class="sidebar">

        <div class="logo">
            <img src="../images/logo-psico-center.png" alt="Logo Psicocenter">
            <span>Psicocenter</span>
        </div>


        <div class="usuario">

            <div class="avatar-ring">
                <img id="sidebarPhoto" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' rx='100' fill='%23c7d2e3'/><circle cx='100' cy='78' r='38' fill='%23ffffff'/><path d='M34 172c8-46 42-70 66-70s58 24 66 70' fill='%23ffffff'/></svg>" alt="Foto">
            </div>

            <h3 id="sidebarName">Dr. João Silva</h3>

            <span id="sidebarRole" class="cargo-badge">Psicólogo</span>

        </div>


        <nav>

            <a href="perfil.html" class="active">
                <i class='bx bx-user'></i>
                <span>Perfil</span>
            </a>


            <a href="pacientes.html">
                <i class='bx bx-group'></i>
                <span>Pacientes</span>
            </a>


            <a href="agendamentos.html" class="link-com-badge">
                <i class='bx bx-calendar'></i>
                <span>Agendamentos</span>
                <span id="agendamentosBadge" class="badge-notificacao"></span>
            </a>


            <a href="mensagens.html" class="link-com-badge">
                <i class='bx bx-message-circle'></i>
                <span>Mensagens</span>
                <span id="mensagensBadge" class="badge-notificacao"></span>
            </a>


        </nav>

        <button id="sidebarLogoutBtn" type="button" class="sidebar-sair">
            <i class='bx bx-log-out'></i>
            <span>Sair</span>
        </button>

    </aside>




    <!-- CONTEÚDO -->

    <main class="conteudo">

        <a href="editar_perfil.html" id="editBtn" class="btn-edit-top">Editar Perfil</a>

        <section class="perfil">


            <h1>Meu Perfil</h1>
            <p id="loadingIndicator" class="carregando-dados" style="display:none;">
                <span class="spinner"></span>
                Carregando dados...
            </p>


            <div class="card">



                <img id="profilePhoto" class="foto-perfil" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' rx='100' fill='%23c7d2e3'/><circle cx='100' cy='78' r='38' fill='%23ffffff'/><path d='M34 172c8-46 42-70 66-70s58 24 66 70' fill='%23ffffff'/></svg>" alt="Foto do Psicólogo">


                <h2 id="fullName">
                    Dr. João Silva
                </h2>


                <p id="role">
                    Psicólogo Clínico
                </p>


                <hr>


                <div class="informacoes">

                    <p>
                        <strong>Email:</strong>
                        <span id="emailVal">joao@email.com</span>
                    </p>


                    <p>
                        <strong>Telefone:</strong>
                        <span id="phoneVal">(11) 99999-9999</span>
                    </p>


                    <p>
                        <strong>CRP:</strong>
                        <span id="crpVal">06/123456</span>
                    </p>

                    <p>
                        <strong>Biografia:</strong>
                        <span id="bioVal"></span>
                    </p>


                </div>


                <button id="scheduleBtn" class="editar" style="display:none; margin-top: 12px;">
                    Agendar consulta
                </button>


            </div>


        </section>


    </main>



</body>

    <script src="../js/api-config.js"></script>
    <script src="../js/avatar.js"></script>
    <script src="../js/icons.js"></script>
    <script src="../js/chat-badge.js"></script>
    <script src="../js/appointments-badge.js"></script>
    <script src="../js/notifications-bell.js"></script>
    <script src="../js/perfil.js"></script>

</html>
