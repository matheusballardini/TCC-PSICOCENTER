<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Psicocenter</title>
    <link rel="stylesheet" href="../style/perfil.css">
    <link rel="stylesheet" href="../style/editar_perfil.css">
</head>

<body>

    <header class="topo-editar">
        <img src="../images/logo-psico-center.png" alt="Logo Psicocenter">
        <h1>Psicocenter</h1>
        <a href="perfil.html" class="voltar-link">← Voltar</a>
    </header>

    <main class="editar-conteudo">
        <section class="perfil">
            <h1>Editar Perfil</h1>
            <p id="loadingIndicator" style="display:none; opacity:0.7; margin-top:-8px;">Carregando dados...</p>

            <form id="editForm" class="card edit-card">

                <div class="photo-preview-wrap">
                    <img id="photoPreview" src="../images/psicologo.webp" alt="Preview">
                </div>
                <label class="file-label">
                    Escolher foto
                    <input id="edit_photo" type="file" accept="image/*" hidden>
                </label>

                <div class="input-box">
                    <label>Nome</label>
                    <input id="edit_name" type="text" required>
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input id="edit_email" type="email" required>
                </div>

                <div class="input-box">
                    <label>Telefone</label>
                    <input id="edit_phone" type="text">
                </div>

                <div class="input-box">
                    <label>CRP</label>
                    <input id="edit_crp" type="text">
                </div>

                <div class="input-box">
                    <label>Biografia</label>
                    <textarea id="edit_bio" rows="4"></textarea>
                </div>

                <p id="editMessage" class="register-link"></p>

                <div class="edit-actions">
                    <button type="submit" class="btn" id="saveBtn">Salvar alterações</button>
                    <button type="button" class="btn-secondary" id="cancelBtn2">Cancelar</button>
                </div>
            </form>

            <div class="conta-actions">
                <button type="button" id="logoutBtn" class="btn-sair">Sair</button>
                <button type="button" id="deleteAccountBtn" class="btn-excluir">Excluir conta</button>
            </div>
        </section>
    </main>

    <script src="../js/editar_perfil.js"></script>
</body>

</html>
