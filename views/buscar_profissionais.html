<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="icon" type="image/png" href="../images/favicon.png">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buscar Profissionais - Psicocenter</title>
    <meta name="description" content="Busque psicólogos por especialidade, modalidade e localização, e agende sua consulta diretamente pela plataforma.">

    <link rel="stylesheet" href="../style/buscarprofi.css">
    <link rel="stylesheet" href="../style/avaliacao.css">
    <link rel="stylesheet" href="../style/chat-badge.css">

    <link
        href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
        rel="stylesheet"
    >

</head>


<body>


    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header class="cabecalho">

        <div class="logo-container">

            <img
                src="../images/logo-psico-center.png"
                alt="Logo Psicocenter"
            >

            <span class="psico">
                Psicocenter
            </span>

        </div>

        <nav class="menu-cabecalho">

            <a href="mensagens_paciente.html" id="linkMensagens" class="link-com-badge" style="display:none;">
                <i class="bx bx-message-circle"></i>
                Mensagens
                <span id="mensagensBadge" class="badge-notificacao"></span>
            </a>

            <a href="index.html" id="botaoVoltar" class="botao-voltar">← Voltar</a>

        </nav>

    </header>



    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main class="conteudo">


        <h1 class="titulo">
            Buscar Profissionais
        </h1>


        <p class="subtitulo">
            Encontre o psicólogo ideal para suas necessidades -
            4 profissionais disponíveis
        </p>



        <!-- =========================
             BUSCA
        ========================== -->

        <div class="search-container">

            <div class="search-box">

                <span class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
                </span>

                <input
                    type="text"
                    placeholder="Buscar por nome, especialidade ou localização..."
                >

            </div>

        </div>



        <!-- =========================
             FILTROS
        ========================== -->

        <div class="filtros">


            <div class="filtro-linha">

                <span class="filtro-titulo">
                    Especialidade:
                </span>


                <button class="filtro ativo">
                    Todos
                </button>

                <button class="filtro">
                    Ansiedade
                </button>

                <button class="filtro">
                    Depressão
                </button>

                <button class="filtro">
                    Relacionamentos
                </button>

                <button class="filtro">
                    Autoestima
                </button>

                <button class="filtro">
                    Luto
                </button>

                <button class="filtro">
                    Terapia de Casal
                </button>

                <button class="filtro">
                    Terapia Infantil
                </button>

                <button class="filtro">
                    Burnout
                </button>

                <button class="filtro">
                    Trauma
                </button>

                <button class="filtro">
                    Família
                </button>

                <button class="filtro">
                    Desenvolvimento
                </button>

                <button class="filtro">
                    Outros
                </button>

            </div>



            <div class="filtro-linha">

                <span class="filtro-titulo">
                    Modalidade:
                </span>


                <button class="filtro ativo">
                    Todos
                </button>

                <button class="filtro">
                    Presencial
                </button>

                <button class="filtro">
                    Online
                </button>

            </div>

        </div>



        <!-- =========================
             PROFISSIONAIS
        ========================== -->

        <p id="loadingProfissionais" class="carregando-dados">Carregando profissionais...</p>

        <section class="profissionais">
            <!-- Cards serão carregados dinamicamente pelo JavaScript -->
        </section>


       </main>

    <script src="../js/api-config.js"></script>
    <script src="../js/avatar.js"></script>
    <script src="../js/icons.js"></script>
    <script src="../js/avaliacao.js"></script>
    <script src="../js/chat-badge.js"></script>
    <script src="../js/notifications-bell.js"></script>
    <script src="../js/buscarprofi.js"></script>

</body>

</html>
